name: Update rankings

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

# A manual dispatch racing the scheduled run would make the two
# git-auto-commit steps fight over the same files.
concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OG cover rendering deps
        # cairosvg rasterizes assets/og-cover.svg into the PNG that social
        # crawlers actually display (OG/Twitter cards do not render SVG).
        # Noto CJK fonts are needed or the Chinese headline turns into tofu.
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install cairosvg

      - name: Update ranking data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_rankings.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Commit updated rankings
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update academic research skill rankings"
          file_pattern: README.md data/rankings.json data/rankings.js data/history.js data/rankings.csv data/history/*.json sitemap.xml feed.xml assets/og-cover.svg assets/og-cover.png

      - name: Redeploy GitHub Pages
        # The auto-commit uses GITHUB_TOKEN, whose pushes do NOT trigger other
        # `on: push` workflows — so Pages would otherwise serve stale data.
        # Re-trigger the Pages deploy explicitly when data changed.
        if: steps.commit.outputs.changes_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'main',
            });

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runLink = `[run #${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const body = `The daily update workflow failed at ${new Date().toISOString()}. See ${runLink}.`;
            // Comment on the existing failure issue instead of opening a new
            // one per failed day — a multi-day outage would otherwise spam.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'auto-update-failure',
              per_page: 1,
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Ranking update failed on ${new Date().toISOString().slice(0, 10)}`,
                body,
                labels: ['auto-update-failure'],
              });
            }
